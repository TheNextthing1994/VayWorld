name: VayWorld Hybrid Visual Check

on:
  push:
    branches:
      - fix/hybrid-visual-parity-v2
  pull_request:
    paths:
      - 'src/components/HybridOverview.tsx'
      - 'src/components/SpatialMissionScene.tsx'
      - 'src/services/councilService.ts'
      - 'src/services/councilService.test.ts'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      # Repo lockfile predates recharts dependency. Don't alter it in this UI change.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: node --test src/services/councilService.test.ts
